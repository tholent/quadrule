[package]
name = "spike-format"
version = "0.1.0"
edition = "2024"

[dependencies]
ciborium = "0.2.2"
flate2 = "1.1.11"
png = "0.18.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11.1"
skrifa = "0.49.0"
uuid = { version = "1.29.2", features = ["serde", "v4"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
