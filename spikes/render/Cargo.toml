[package]
name = "spike-render"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"], optional = true }
png = "0.18"
pollster = { version = "1", optional = true }
sha2 = "0.11"
tiny-skia = "0.12"
vello = { version = "0.11", optional = true }
vello_cpu = { version = "0.3", optional = true }

[features]
# Heavy parts are opt-in so the tiny-skia checks build fast on the Pi.
vello-cpu = ["dep:vello_cpu"]
gpu = ["dep:vello", "dep:pollster"]
canvas = ["gpu", "dep:eframe"]

[[example]]
name = "gpu"
required-features = ["gpu"]

[[example]]
name = "canvas"
required-features = ["canvas"]

[[example]]
name = "bench"

# Standalone: not part of any workspace.
[workspace]
