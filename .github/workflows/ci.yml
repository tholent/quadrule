# Build, test, clippy and rustfmt on Linux (x86), macOS (ARM) and Windows (x86) (napkin §15.3).
# The slice test compares each exported PNG with the golden image blessed on the Pi (ARM), so
# a pass on all three is the cross-machine check ADR-002 (T14/T15) and ADR-003 (item 6) owe.
#
# Cost: the repository is public, so GitHub's standard runners are free. Runs on pull requests
# and pushes to main that change what it tests (the paths below), and by hand. A change to docs,
# napkins or spikes alone does not run it. Fuzzing is its own workflow (fuzz.yml).
name: CI

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      # The safe-zone and stock-grid tests read the device screenshots.
      - "docs/device-measurements/**/*.png"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      # The safe-zone and stock-grid tests read the device screenshots.
      - "docs/device-measurements/**/*.png"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# A newer push cancels an older run on a branch, but never on main: every commit on main gets
# a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins Rust 1.99.1 with clippy and rustfmt; this installs it.
      - name: Toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace -- --nocapture 2>&1 | tee test.log

      - name: Structured results
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} ($(uname -m))"
            echo '```'
            grep '^CHECK' test.log || echo "no CHECK lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^CHECK' test.log || true

      - name: Upload exported files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.os }}
          path: target/tmp/slice/
          if-no-files-found: warn
