# Build, test, clippy and rustfmt on Linux (x86), macOS (ARM) and Windows (x86) (napkin §15.3).
# The slice test compares each exported PNG with the golden image blessed on the Pi (ARM), so
# a pass on all three is the cross-machine check ADR-002 (T14/T15) and ADR-003 (item 6) owe.
#
# Cost: the repository is public, so GitHub's standard runners are free. Runs on pull requests,
# pushes to main and by hand.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push cancels an older run on a branch, but never on main: every commit on main gets
# a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins Rust 1.99.1 with clippy and rustfmt; this installs it.
      - name: Toolchain
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace -- --nocapture 2>&1 | tee test.log

      - name: Structured results
        if: always()
        run: |
          {
            echo "### ${{ matrix.os }} ($(uname -m))"
            echo '```'
            grep '^CHECK' test.log || echo "no CHECK lines"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^CHECK' test.log || true

      - name: Upload exported files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.os }}
          path: target/tmp/slice/
          if-no-files-found: warn

  # ADR-001 item 8: a short fuzz run of the .quad reader on every push (nightly Rust, Linux only).
  # Longer runs: cd crates/format && cargo +nightly fuzz run open_quad fuzz/corpus/open_quad fuzz/seeds/open_quad
  fuzz:
    name: fuzz (.quad reader, 60 s)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz
        working-directory: crates/format
        run: |
          mkdir -p fuzz/corpus/open_quad
          cargo +nightly fuzz run open_quad fuzz/corpus/open_quad fuzz/seeds/open_quad -- -max_total_time=60 -print_final_stats=1
      - name: Upload a crashing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/format/fuzz/artifacts/
          if-no-files-found: ignore

