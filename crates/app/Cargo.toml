[package]
name = "quadrule-app"
description = "Quadrule, the app (napkin §15.1): eframe setup, the window, preferences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "quadrule"
path = "src/main.rs"

[dependencies]
directories.workspace = true
eframe.workspace = true
quadrule-layout.workspace = true
quadrule-profiles.workspace = true
quadrule-text.workspace = true
quadrule-ui.workspace = true
quadrule-model.workspace = true
rfd.workspace = true
vello.workspace = true

[dev-dependencies]
pollster.workspace = true

# The Mac's menu bar, which replaces the menu bar the window draws on Windows and Linux (fixes batch 2, Q7).
[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true
# The application delegate that hears files Finder asks to open (fixes batch 2, the macOS double-click).
quadrule-macos = { path = "../macos" }
# The event loop eframe would make, made here instead so the delegate goes in before it runs (the version eframe uses).
winit = { version = "=0.30.13", default-features = false }

[lints]
workspace = true
