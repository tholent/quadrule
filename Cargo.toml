# The quadrule workspace (napkin §15.1). Crates arrive with the rung that uses them (rung 1 bbq,
# Q5): rung 1 the six for the headless slice, then lint and xtask; rung 2 adds i18n, ui and app
# (docs/bbq/2026-11-09-rung-2-viewer.md). `spikes/` stays outside it.

[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/profiles",
    "crates/layout",
    "crates/format",
    "crates/text",
    "crates/render",
    "crates/lint",
    "crates/i18n",
    "crates/ui",
    "crates/app",
    "crates/macos",
    "crates/xtask",
]
# No `default-members`: plain `cargo build` and `cargo test` build and test everything, the window
# included, as CI does (ADR-008, amendment of 2026-11-20: the opt-in app build was for the Pi).

[workspace.package]
version = "0.16.6"
edition = "2024"
# rust-toolchain.toml pins this compiler for every machine and CI.
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
quadrule-model = { path = "crates/model" }
quadrule-profiles = { path = "crates/profiles" }
quadrule-layout = { path = "crates/layout" }
quadrule-format = { path = "crates/format" }
quadrule-text = { path = "crates/text" }
quadrule-render = { path = "crates/render" }
quadrule-lint = { path = "crates/lint" }
quadrule-i18n = { path = "crates/i18n" }
quadrule-ui = { path = "crates/ui" }

ciborium = "0.2.2"
# The user's data folder, for recovery files (napkin §15.2; rung 3 bbq, Defaulted "Autosave").
directories = "6.0.0"
# ADR-002 item 1: fontdb and skrifa come only through cosmic-text's re-exports; swash is off.
# The window (rung 2): eframe on wgpu (napkin §15.2; rung 2 bbq, Defaulted "Graphics backend").
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
# monochrome_emoji_fonts: egui's own fonts lack ⚠ and ℹ, which the lint panel uses.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_kittest = "0.37.0"
# The Mac's menu bar (fixes batch 2, Q7), on macOS only: Tauri's menu crate, MIT OR Apache-2.0, 0.21.2 of 2026-10-08.
# Pinned exactly. `default-features = false` leaves out its GTK menus, which nothing here uses.
muda = { version = "=0.21.2", default-features = false }
# The system file dialog (napkin §15.2); on Linux it asks the desktop's portal.
rfd = "0.18.0"
# Napkin §14: every string on screen goes through Fluent (rung 2 bbq Q5).
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig"] }
# Only to name the `Script` type in cosmic-text's `Fallback` trait (rung 11a: bundled-only fallback);
# the same 0.5.9 cosmic-text already uses, so no second copy. Not one of ADR-002 item 1's three.
unicode-script = "0.5.9"
# Emoji names and groups for the picker (rung 11a, chris 2026-11-15 "Allow, ship the notice"): licence
# (MIT OR Apache-2.0) AND Unicode-3.0, whose notice ships beside the OFL texts.
emojis = "0.9.1"
# The same kurbo vello_cpu 0.3 uses, so paths pass between layout and render unchanged.
kurbo = "0.13.1"
png = "0.18.1"
# The export day for the {date} token, in local time (rung 15 bbq, Defaulted "Tokens"); std has no time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ron = "0.12.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["serde", "v4"] }
# ADR-003: export renders with vello_cpu. No multithreading (one thread, one order of work),
# no png/text extras (quadrule encodes PNGs and draws text itself).
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
# ADR-018: export runs at fearless_simd's fallback level (no fused multiply-add) on every
# computer. The same 0.7.0 vello_cpu uses; the feature only makes `Level::fallback()` exist.
fearless_simd = { version = "0.7.0", default-features = false, features = ["force_support_fallback"] }
# The graphics-chip canvas (rung 3 bbq Q4): the same wgpu 30.0.1, kurbo and peniko as eframe and
# vello_cpu (spike R14). Never used for export (ADR-003 item 3).
vello = "0.11.0"
# Waits on the chip for the app's chip tests (already in the lock through vello).
pollster = "1.0.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

# Line numbers in error reports, but no full debugger data: the build folder stays a fraction of its size
# (docs/proposals/build-pruning-2026-11-19.md). Does not change debug_assertions or optimisation.
# `CARGO_PROFILE_DEV_DEBUG=true cargo build` gives our own crates full debugger data for one session.
[profile.dev]
debug = "line-tables-only"

# Libraries we don't write get no debug information at all.
[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Exact float comparisons are deliberate in the pixel and determinism checks.
float_cmp = "allow"
