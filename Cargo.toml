# The quadrule workspace (napkin §15.1). Crates arrive with the rung that uses them (rung 1 bbq,
# Q5): rung 1 the six for the headless slice, then lint and xtask; rung 2 adds i18n, ui and app
# (docs/bbq/2026-11-09-rung-2-viewer.md). `spikes/` stays outside it.

[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/profiles",
    "crates/layout",
    "crates/format",
    "crates/text",
    "crates/render",
    "crates/lint",
    "crates/i18n",
    "crates/ui",
    "crates/app",
    "crates/xtask",
]
# Rung 2 bbq Q9: the window is an opt-in build. Plain `cargo build` / `cargo test` at the root
# leave out `ui` and `app` (the graphics stack is heavy on the Pi); `-p quadrule-app`,
# `-p quadrule-ui` or `--workspace` build them, and CI does.
default-members = [
    "crates/model",
    "crates/profiles",
    "crates/layout",
    "crates/format",
    "crates/text",
    "crates/render",
    "crates/lint",
    "crates/i18n",
    "crates/xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
# The Rust on the Pi (STATUS.md); rust-toolchain.toml pins CI to the same compiler.
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
quadrule-model = { path = "crates/model" }
quadrule-profiles = { path = "crates/profiles" }
quadrule-layout = { path = "crates/layout" }
quadrule-format = { path = "crates/format" }
quadrule-text = { path = "crates/text" }
quadrule-render = { path = "crates/render" }
quadrule-lint = { path = "crates/lint" }
quadrule-i18n = { path = "crates/i18n" }
quadrule-ui = { path = "crates/ui" }

ciborium = "0.2.2"
# The user's data folder, for recovery files (napkin §15.2; rung 3 bbq, Defaulted "Autosave").
directories = "6.0.0"
# ADR-002 item 1: fontdb and skrifa come only through cosmic-text's re-exports; swash is off.
# The window (rung 2): eframe on wgpu (napkin §15.2; rung 2 bbq, Defaulted "Graphics backend").
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
# monochrome_emoji_fonts: egui's own fonts lack ⚠ and ℹ, which the lint panel uses.
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_kittest = "0.37.0"
# The system file dialog (napkin §15.2); on Linux it asks the desktop's portal.
rfd = "0.18.0"
# Napkin §14: every string on screen goes through Fluent (rung 2 bbq Q5).
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig"] }
# The same kurbo vello_cpu 0.3 uses, so paths pass between layout and render unchanged.
kurbo = "0.13.1"
png = "0.18.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
uuid = { version = "1.29.2", features = ["serde", "v4"] }
# ADR-003: export renders with vello_cpu. No multithreading (one thread, one order of work),
# no png/text extras (quadrule encodes PNGs and draws text itself).
vello_cpu = { version = "0.3.0", default-features = false, features = ["std", "u8_pipeline"] }
# The graphics-chip canvas (rung 3 bbq Q4): the same wgpu 30.0.1, kurbo and peniko as eframe and
# vello_cpu (spike R14). Never used for export (ADR-003 item 3).
vello = "0.11.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# Exact float comparisons are deliberate in the pixel and determinism checks.
float_cmp = "allow"
